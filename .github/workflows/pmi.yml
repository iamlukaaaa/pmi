name: ISM workflows

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:

      # =========================
      # 1. 코드 가져오기
      # =========================
      - uses: actions/checkout@v4

      # =========================
      # 2. Python 설치
      # =========================
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      # =========================
      # 3. 의존성 설치
      # =========================
      - name: Install dependencies
        run: |
          pip install playwright beautifulsoup4 gspread google-auth
          playwright install --with-deps chromium

      # =========================
      # 4. PMI 실행 (1차)
      # =========================
      - name: Run PMI script (1st run)
        env:
          google: ${{ secrets.google }}
        run: python pmi.py

      # =========================
      # 5. PMI 실행 (2차 - 재실행)
      # =========================
      - name: Run PMI script (2nd run)
        env:
          google: ${{ secrets.google }}
        run: python pmi.py

      # =========================
      # 6. SERVICES 실행
      # =========================
      - name: Run SERVICES script
        env:
          google: ${{ secrets.google }}
        run: python services.py

      # =========================
      # 7. Commit CSV files
      # =========================
      - name: Commit CSV files
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "github-actions@github.com"

          git add .

          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          git commit -m "Add PMI & Services reports"
          git push
