name: ISM PMI & Services Scraper

on:
  workflow_dispatch:

  schedule:
    # 매월 7일 UTC 22:00 실행
    - cron: "0 22 7 * *"


permissions:
  contents: write


jobs:
  scrape:

    runs-on: ubuntu-latest


    steps:

      # =========================
      # GitHub 코드 가져오기
      # =========================
      - name: Checkout repository
        uses: actions/checkout@v4


      # =========================
      # Python 설치
      # =========================
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"


      # =========================
      # 패키지 설치
      # =========================
      - name: Install dependencies
        run: |
          pip install playwright beautifulsoup4 gspread google-auth
          playwright install --with-deps chromium


      # =========================
      # PMI 실행
      # =========================
      - name: Run PMI script
        env:
          google: ${{ secrets.google }}
        run: python pmi.py


      # =========================
      # SERVICES 실행
      # =========================
      - name: Run SERVICES script
        env:
          google: ${{ secrets.google }}
        run: python services.py


      # =========================
      # CSV 저장 commit
      # =========================
      - name: Commit CSV files
        run: |

          git config --global user.name "github-actions"

          git config --global user.email "github-actions@github.com"


          git add .


          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi


          git commit -m "Auto update ISM PMI Services data"

          git push
