name: ISM PMI & Services Scraper

on:
  workflow_dispatch:

  schedule:
    # 매월 7일 (UTC 기준, 안전하게 8일로 처리 추천)
    - cron: "0 0 8 * *"


permissions:
  contents: write


jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          pip install playwright gspread google-auth
          playwright install --with-deps chromium

      - name: Run PMI script
        env:
          google: ${{ secrets.google }}
        run: python pmi.py

      - name: Run SERVICES script
        env:
          google: ${{ secrets.google }}
        run: python services.py

      - name: Commit CSV files
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "github-actions@github.com"

          git add ism_*.csv

          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          git commit -m "Auto update ISM PMI Services data"
          git push
