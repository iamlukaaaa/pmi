name: First pmi workflow

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          pip install playwright beautifulsoup4
          playwright install --with-deps chromium

      # =========================
      # PMI 실행
      # =========================
      - name: Run PMI script
        run: python pmi.py

      # =========================
      # SERVICES 실행 (추가)
      # =========================
      - name: Run SERVICES script
        run: python services.py

      # =========================
      # Git commit & push (둘 다 저장 후 1번만)
      # =========================
      - name: Commit CSV files
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "github-actions@github.com"
          git add .
          git commit -m "Add PMI & Services reports"
          git push
